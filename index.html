<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #ffffff;
  --surface: #f7f7f5;
  --display-bg: #ffffff;
  --btn-bg: #f7f7f5;
  --btn-hover: #ecece8;
  --btn-active: #e0e0dc;
  --accent: #2eaadc;
  --accent-hover: #2691c7;
  --accent-light: rgba(46, 170, 220, 0.1);
  --text: #37352f;
  --text-muted: #787774;
  --display-text: #37352f;
  --border: #e9e9e7;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.08);
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.calculator {
  width: 340px;
  background: var(--surface);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}

.display {
  background: var(--display-bg);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 16px;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  overflow: hidden;
  border: 1px solid var(--border);
}

.display-previous {
  font-size: 14px;
  color: var(--text-muted);
  min-height: 20px;
  word-break: break-all;
  text-align: right;
  width: 100%;
  font-variant-numeric: tabular-nums;
}

.display-current {
  font-size: 36px;
  font-weight: 500;
  color: var(--display-text);
  min-height: 44px;
  word-break: break-all;
  text-align: right;
  width: 100%;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  transition: font-size 0.15s ease;
}

.display-current.shrink {
  font-size: 26px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.btn {
  height: 52px;
  border: 1px solid transparent;
  border-radius: 8px;
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.1s ease, border-color 0.1s ease, box-shadow 0.1s ease;
  background: var(--btn-bg);
  color: var(--text);
  outline: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  font-family: inherit;
}

.btn:hover {
  background: var(--btn-hover);
}

.btn:active {
  background: var(--btn-active);
  transform: scale(0.97);
}

.btn:focus-visible {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-light);
}

.btn-operator {
  background: var(--accent);
  color: #ffffff;
  font-size: 19px;
  border-color: transparent;
}

.btn-operator:hover {
  background: var(--accent-hover);
}

.btn-operator:active {
  background: #1f8ab5;
  transform: scale(0.97);
}

.btn-operator.active {
  background: var(--accent-hover);
  box-shadow: 0 0 0 2px var(--accent-light);
}

.btn-function {
  background: transparent;
  color: var(--text-muted);
  font-size: 15px;
  border-color: var(--border);
}

.btn-function:hover {
  background: var(--btn-hover);
  color: var(--text);
}

.btn-function:active {
  background: var(--btn-active);
}

.btn-zero {
  grid-column: span 2;
  text-align: left;
  padding-left: 24px;
}

.btn-equals {
  background: var(--accent);
  color: #ffffff;
  font-size: 21px;
  height: 52px;
  border-color: transparent;
}

.btn-equals:hover {
  background: var(--accent-hover);
}

.btn-equals:active {
  background: #1f8ab5;
  transform: scale(0.97);
}

.btn-backspace {
  font-size: 17px;
}

@media (max-width: 400px) {
  .calculator {
    width: 100%;
    border-radius: 0;
    min-height: 100vh;
    padding: 12px;
    border: none;
    border-radius: 0;
  }

  .display {
    border-radius: 8px;
  }

  .buttons {
    gap: 6px;
  }

  .btn {
    height: 48px;
    font-size: 16px;
    border-radius: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .btn, .display-current {
    transition: none;
  }
}
</style>
</head>
<body>
<div class="calculator" role="application" aria-label="Calculator">
  <div class="display">
    <div class="display-previous" id="previous" aria-live="polite"></div>
    <div class="display-current" id="current" aria-live="assertive">0</div>
  </div>
  <div class="buttons">
    <button class="btn btn-function" data-action="clear" aria-label="Clear">C</button>
    <button class="btn btn-function" data-action="backspace" aria-label="Backspace">⌫</button>
    <button class="btn btn-function" data-action="percent" aria-label="Percent">%</button>
    <button class="btn btn-operator" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

    <button class="btn" data-action="digit" data-value="7" aria-label="7">7</button>
    <button class="btn" data-action="digit" data-value="8" aria-label="8">8</button>
    <button class="btn" data-action="digit" data-value="9" aria-label="9">9</button>
    <button class="btn btn-operator" data-action="operator" data-value="×" aria-label="Multiply">×</button>

    <button class="btn" data-action="digit" data-value="4" aria-label="4">4</button>
    <button class="btn" data-action="digit" data-value="5" aria-label="5">5</button>
    <button class="btn" data-action="digit" data-value="6" aria-label="6">6</button>
    <button class="btn btn-operator" data-action="operator" data-value="−" aria-label="Subtract">−</button>

    <button class="btn" data-action="digit" data-value="1" aria-label="1">1</button>
    <button class="btn" data-action="digit" data-value="2" aria-label="2">2</button>
    <button class="btn" data-action="digit" data-value="3" aria-label="3">3</button>
    <button class="btn btn-operator" data-action="operator" data-value="+" aria-label="Add">+</button>

    <button class="btn" data-action="negate" aria-label="Negate">±</button>
    <button class="btn" data-action="digit" data-value="0" aria-label="0">0</button>
    <button class="btn" data-action="decimal" aria-label="Decimal point">.</button>
    <button class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>
  </div>
</div>

<script>
(function() {
  var currentDisplay = document.getElementById('current');
  var previousDisplay = document.getElementById('previous');
  var activeOperatorBtn = null;

  var state = {
    current: '0',
    previous: '',
    operator: null,
    waitingForOperand: false,
    justEvaluated: false
  };

  function updateDisplay() {
    var text = state.current;
    if (text.length > 14) {
      currentDisplay.textContent = parseFloat(text).toExponential(6);
    } else {
      currentDisplay.textContent = text;
    }

    if (state.current.length > 9) {
      currentDisplay.classList.add('shrink');
    } else {
      currentDisplay.classList.remove('shrink');
    }

    if (state.previous && state.operator) {
      previousDisplay.textContent = state.previous + ' ' + state.operator;
    } else {
      previousDisplay.textContent = '';
    }
  }

  function clearActiveOperator() {
    if (activeOperatorBtn) {
      activeOperatorBtn.classList.remove('active');
      activeOperatorBtn = null;
    }
  }

  function setActiveOperator(btn) {
    clearActiveOperator();
    activeOperatorBtn = btn;
    btn.classList.add('active');
  }

  function inputDigit(digit) {
    if (state.waitingForOperand) {
      state.current = digit;
      state.waitingForOperand = false;
    } else if (state.current === '0' && digit !== '0') {
      state.current = digit;
    } else if (state.current === '0' && digit === '0') {
      return;
    } else {
      if (state.current.length >= 15) return;
      state.current += digit;
    }
    state.justEvaluated = false;
    updateDisplay();
  }

  function inputDecimal() {
    if (state.waitingForOperand) {
      state.current = '0.';
      state.waitingForOperand = false;
      updateDisplay();
      return;
    }
    if (state.current.indexOf('.') === -1) {
      state.current += '.';
    }
    updateDisplay();
  }

  function inputOperator(op) {
    if (state.justEvaluated) {
      state.previous = state.current;
      state.operator = op;
      state.waitingForOperand = true;
      state.justEvaluated = false;
      setActiveOperator(document.querySelector('[data-value="' + op + '"]'));
      updateDisplay();
      return;
    }

    if (state.operator && !state.waitingForOperand) {
      evaluate();
    }

    state.previous = state.current;
    state.operator = op;
    state.waitingForOperand = true;
    setActiveOperator(document.querySelector('[data-value="' + op + '"]'));
    updateDisplay();
  }

  function evaluate() {
    if (state.operator === null || state.previous === '') return;

    var prev = parseFloat(state.previous);
    var curr = parseFloat(state.current);
    var result;

    switch (state.operator) {
      case '+':
        result = prev + curr;
        break;
      case '−':
        result = prev - curr;
        break;
      case '×':
        result = prev * curr;
        break;
      case '÷':
        if (curr === 0) {
          state.current = 'Error';
          state.previous = '';
          state.operator = null;
          state.waitingForOperand = true;
          state.justEvaluated = true;
          clearActiveOperator();
          updateDisplay();
          return;
        }
        result = prev / curr;
        break;
      default:
        return;
    }

    if (!isFinite(result)) {
      state.current = 'Error';
    } else {
      state.current = formatResult(result);
    }

    state.previous = '';
    state.operator = null;
    state.waitingForOperand = true;
    state.justEvaluated = true;
    clearActiveOperator();
    updateDisplay();
  }

  function formatResult(num) {
    if (Number.isInteger(num) && Math.abs(num) < 1e15) {
      return num.toString();
    }
    var str = num.toPrecision(12);
    var parsed = parseFloat(str);
    if (isNaN(parsed)) return '0';
    return parsed.toString();
  }

  function clearAll() {
    state.current = '0';
    state.previous = '';
    state.operator = null;
    state.waitingForOperand = false;
    state.justEvaluated = false;
    clearActiveOperator();
    updateDisplay();
  }

  function backspace() {
    if (state.waitingForOperand) return;
    if (state.current === 'Error') {
      clearAll();
      return;
    }
    if (state.current.length === 1 || (state.current.length === 2 && state.current[0] === '-')) {
      state.current = '0';
    } else {
      state.current = state.current.slice(0, -1);
    }
    updateDisplay();
  }

  function toggleNegate() {
    if (state.current === '0' || state.current === 'Error') return;
    if (state.current.charAt(0) === '-') {
      state.current = state.current.slice(1);
    } else {
      state.current = '-' + state.current;
    }
    updateDisplay();
  }

  function inputPercent() {
    if (state.current === 'Error') return;
    var value = parseFloat(state.current);
    if (isNaN(value)) return;
    state.current = formatResult(value / 100);
    state.waitingForOperand = true;
    updateDisplay();
  }

  function handleAction(action, value, btn) {
    switch (action) {
      case 'digit':
        inputDigit(value);
        break;
      case 'decimal':
        inputDecimal();
        break;
      case 'operator':
        inputOperator(value);
        break;
      case 'equals':
        evaluate();
        break;
      case 'clear':
        clearAll();
        break;
      case 'backspace':
        backspace();
        break;
      case 'negate':
        toggleNegate();
        break;
      case 'percent':
        inputPercent();
        break;
    }
  }

  var buttons = document.querySelectorAll('.btn');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function() {
      var action = this.getAttribute('data-action');
      var value = this.getAttribute('data-value');
      handleAction(action, value, this);
    });
  }

  document.addEventListener('keydown', function(e) {
    var key = e.key;

    if (key >= '0' && key <= '9') {
      inputDigit(key);
      return;
    }

    if (key === '.') {
      e.preventDefault();
      inputDecimal();
      return;
    }

    if (key === '+') {
      e.preventDefault();
      inputOperator('+');
      return;
    }

    if (key === '-') {
      e.preventDefault();
      inputOperator('−');
      return;
    }

    if (key === '*') {
      e.preventDefault();
      inputOperator('×');
      return;
    }

    if (key === '/') {
      e.preventDefault();
      inputOperator('÷');
      return;
    }

    if (key === 'Enter' || key === '=') {
      e.preventDefault();
      evaluate();
      return;
    }

    if (key === 'Escape' || key === 'Delete') {
      e.preventDefault();
      clearAll();
      return;
    }

    if (key === 'Backspace') {
      e.preventDefault();
      backspace();
      return;
    }

    if (key === '%') {
      e.preventDefault();
      inputPercent();
      return;
    }
  });

  updateDisplay();
})();
</script>
</body>
</html>
